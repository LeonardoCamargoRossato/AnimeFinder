name: Refactor Anime Details route once

on:
  push:
    paths:
      - 'tools/refactor-details-trigger.txt'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace legacy Anime Details route
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text()
          text = text.replace(
              "import { Navigate, NavLink, Route, Routes, useNavigate, useParams } from 'react-router-dom'",
              "import { Navigate, NavLink, Route, Routes, useNavigate } from 'react-router-dom'",
          )
          marker = "import { getAuthRedirectUrl, isSupabaseConfigured, supabase } from './supabase'\n"
          if "import AnimeDetailsRoute from './AnimeDetailsRoute'" not in text:
              text = text.replace(marker, marker + "import AnimeDetailsRoute from './AnimeDetailsRoute'\n")
          text = text.replace(
              '<Route path="anime/:id" element={<AnimeDetails />} />',
              '<Route path="anime/:id" element={<AnimeDetailsRoute />} />',
          )
          start = text.find('\nfunction AnimeDetails() {')
          end = text.find('\nfunction Settings(', start)
          if start != -1 and end != -1:
              text = text[:start] + text[end:]
          path.write_text(text)
          PY
      - name: Commit route refactor
        run: |
          git config user.name "AnimeFinder Builder"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx
          git rm .github/workflows/refactor-details-once.yml tools/refactor-details-trigger.txt
          git commit -m "Use one progressive Anime Details route"
          git push
